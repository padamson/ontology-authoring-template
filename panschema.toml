# panschema consumer manifest. `panschema generate` reads this to emit the
# machine-readable formats to site/artifacts/ (deployed with the docs site).
# HTML documentation comes from `panschema publish` + panschema-publish.toml,
# not here.
#
# `path = "."` references THIS repo's own package (the panschema-publish.toml
# at the root) — the local-package field, distinct from `source`, which is for
# remote `github:` dependencies. Format keys are deny_unknown_fields, so a typo
# is a hard parse error, not a skip: note `json_schema` (underscore) but
# `instance-graph-json` (hyphens). Postgres is deliberately omitted: wine's
# multivalued attributes make that writer skip most classes.
[schemas.wine]
path = "."

[generate.wine]
shacl = "site/artifacts/wine-shapes.ttl"
json_schema = "site/artifacts/wine.schema.json"
ttl = "site/artifacts/wine.ttl"
instance-graph-json = "site/artifacts/wine-instances.graph.json"
instances = ["data/wine-instances.yaml"]

# The CQ&A benchmark (data/wine-benchmark.yaml) is instance data of the cqa
# contract, not of wine, so it validates under its own schema entry. cqa has
# no released version yet; until it does, the reference is a sibling checkout
# (CI clones one), and it switches to `source = "github:padamson/cqa-schema"`
# plus a `version` pin at cqa's first release.
[schemas.cqa]
path = "../cqa-schema"

[generate.cqa]
ttl = "site/artifacts/wine-benchmark.ttl"
instances = ["data/wine-benchmark.yaml"]

# The anchor cross-check, run by bare `panschema validate` (and by any
# generate of this entry). Only this repo can run it, because only this
# repo holds both graphs: resolve_against checks every benchmark IRI in
# wine's namespace against the IRIs wine's datasets actually mint;
# verify_absences checks each stated absence (no wine record of the
# connecting class references all the listed anchors); and
# require_namespace_coverage rejects a reference whose namespace no
# resolve_against entry covers, so a typo'd namespace cannot slip past
# the resolution check as "external, unchecked".
[check.cqa]
resolve_against = ["wine"]
verify_absences = { slot = "unconnected_anchors", via = "connecting_class" }
require_namespace_coverage = true

  - id: cabernet-sauvignon
    name: Cabernet Sauvignon
    color: red
    body: full
    flavor: strong
    sugar: dry
    made_from_grape: [cabernet-sauvignon-grape]
  - id: sterling-merlot
    name: Sterling Vineyards Merlot
    color: red
    body: medium
    flavor: moderate
    sugar: dry
    made_from_grape: [merlot]
    maker: sterling-vineyards

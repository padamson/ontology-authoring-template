  - id: gamay
    name: Gamay
  - id: cabernet-sauvignon-grape
    name: Cabernet Sauvignon
  - id: zinfandel
    name: Zinfandel
  - id: merlot
    name: Merlot
  - id: chardonnay
    name: Chardonnay
  - id: grenache
    name: Grenache
  - id: riesling
    name: Riesling

regions:
  - id: beaujolais
    name: Beaujolais
  - id: bordeaux-region

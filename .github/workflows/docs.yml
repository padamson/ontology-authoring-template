name: Build and publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt the JS-based actions (actions/cache, actions/checkout,
# actions/upload-artifact, ...) into Node 24 ahead of the June 2026
# default flip. Removes the deprecation warnings; safe to drop this
# env block once Node 24 becomes the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # panschema publish reads all version tags

      # --- Resolve producer main HEAD SHAs (dogfood-matrix conventions) ---

      - name: Resolve latest panschema main SHA
        id: panschema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/panschema/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve mdbook-admonish fork branch SHA
        id: mdbook-admonish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/mdbook-admonish/commits/feat/mdbook-0.5-compat --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      # --- panschema (needs wasm-pack as a build prerequisite) ---

      - name: Cache panschema binaries
        id: cache-panschema
        uses: actions/cache@v4
        with:
          # panschema (schema docs) and mdbook-panschema (book→schema
          # toolbar link installer) both ship from the one panschema
          # crate, so a single install produces both executables. The
          # `-bins-` key prefix (vs the old `panschema-`) deliberately
          # busts pre-mdbook-panschema cache entries that hold only the
          # one binary.
          path: |
            ~/.cargo/bin/panschema
            ~/.cargo/bin/mdbook-panschema
          key: panschema-bins-${{ runner.os }}-${{ steps.panschema.outputs.sha }}

      - name: Cache wasm-pack binary
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}

      - name: Install wasm-pack
        if: steps.cache-panschema.outputs.cache-hit != 'true' && steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked

      - name: Install panschema binaries from main
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/padamson/panschema \
            --rev ${{ steps.panschema.outputs.sha }} \
            --locked --force \
            panschema

      # --- mdbook + preprocessors ---

      - name: Resolve latest mdbook release version
        id: mdbook-ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/rust-lang/mdBook/releases/latest --jq .tag_name | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache mdbook binary
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ steps.mdbook-ver.outputs.version }}

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version ${{ steps.mdbook-ver.outputs.version }} --locked

      - name: Cache mdbook-listings binary
        id: cache-mdbook-listings
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-listings
          key: mdbook-listings-${{ runner.os }}-0.2.0

      - name: Install mdbook-listings from crates.io
        # Switched off git-main to the released crate (v0.1.1, 2026-08-01):
        # everything the prerelease dogfood exercised — appendix numbering,
        # captions, list-of-listings, the soft-wrap/font-load badge fixes —
        # is in the release, so there's no reason left to track git.
        if: steps.cache-mdbook-listings.outputs.cache-hit != 'true'
        run: cargo install mdbook-listings --version 0.2.0 --locked

      - name: Cache mdbook-admonish binary
        id: cache-mdbook-admonish
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-admonish
          key: mdbook-admonish-${{ runner.os }}-${{ steps.mdbook-admonish.outputs.sha }}

      - name: Install mdbook-admonish from fork branch
        if: steps.cache-mdbook-admonish.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/padamson/mdbook-admonish \
            --rev ${{ steps.mdbook-admonish.outputs.sha }} \
            --locked --force \
            mdbook-admonish

      # --- The cqa contract (sibling checkout) ---

      - name: Fetch the cqa contract
        # data/wine-benchmark.yaml is instance data of the cqa contract, and
        # panschema.toml references cqa by sibling path until cqa's first
        # release gives `source =` a tag to pin. Until then CI provides the
        # sibling the same way a local co-development checkout does.
        run: git clone --depth 1 https://github.com/padamson/cqa-schema ../cqa-schema

      # --- Build outputs ---

      - name: Validate everything the manifest declares (panschema)
        # Bare `validate` reads panschema.toml and checks it all without
        # writing outputs: each curated A-box conforms to its own schema
        # (the wine catalog to wine, the benchmark to cqa), and the
        # `[check.cqa]` cross-graph gates — every benchmark IRI resolves
        # to one wine's graph actually mints, every stated absence holds,
        # no reference lands in an uncovered namespace. This repo is the
        # one place the cross-graph half is possible, because it holds
        # both graphs. `publish` only warns on violations, so fail fast
        # here before building anything.
        run: panschema validate --strict

      - name: Assert invalid fixtures are rejected (panschema)
        # The negative half of validation: every data/invalid/*.yaml MUST
        # fail. If one conforms, the schema stopped catching that error and
        # ch07's "a mistyped verdict fails the check" claim is now false. The
        # top-level data/*.yaml loop above does not recurse, so these stay out
        # of the positive loop.
        run: |
          shopt -s nullglob
          schema="$(scripts/schema-path.sh)"
          for f in data/invalid/*.yaml; do
            if panschema validate --schema "$schema" --data "$f" >/dev/null 2>&1; then
              echo "FAIL: $f conformed but should have been rejected"; exit 1
            fi
            echo "ok, rejected: $f"
          done

      - name: Generate machine-readable artifacts (panschema)
        # TTL (schema + A-box KG), SHACL shapes, JSON Schema, and the
        # instance-graph JSON — the "Other formats" the book names but the
        # publish path never emits. Reads panschema.toml and lands in
        # site/artifacts/, deployed with the site. --strict fails on hard
        # errors (unmodeled constructs, dangling refs, instance-data
        # violations); it is narrower than its name — NOT the
        # unprojected-construct / Postgres-skip / SHACL-skip warnings.
        run: panschema generate --strict

      - name: Publish versioned schema docs (panschema)
        # Output layout: site/schema/main/ (edge), site/schema/current/
        # (alias for the configured `current` version), plus
        # site/schema/<tag>/ for each release tag in panschema-publish.toml.
        run: panschema publish

      - name: Generate book assets (admonish + listings)
        # mdbook-admonish.css and mdbook-listings.css/.js are gitignored
        # generated assets, so a fresh CI checkout lacks them and `mdbook
        # build` fails copying mdbook-admonish.css. install-assets.sh
        # regenerates both from the binaries installed above — the same
        # script the README "Fresh clone" note and setup-ontology use
        # locally, so CI and local builds share one path.
        run: ./scripts/install-assets.sh

      - name: Verify frozen listings (mdbook-listings)
        # Fail fast on frozen-snapshot hash drift or a broken
        # {{#include}} / {{#callout}} before the longer book build.
        # Mirrors the local prek/pre-commit hook (.pre-commit-config.yaml).
        working-directory: book
        run: mdbook-listings verify --book-root .

      - name: Build the book (mdbook)
        # Outputs to book/build/ per the [build] build-dir config.
        working-directory: book
        run: mdbook build

      - name: Combine book + schema docs into site/
        # Book lands at site/ root (index.html, theme/, ch*.html);
        # site/schema/ already populated by `panschema publish`.
        # `cp -r book/build/* site/` is safe because mdbook never
        # produces a `schema/` subdir.
        run: cp -r book/build/* site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    # GitHub Pages on a private repo requires a paid plan, so on a private
    # instantiation `deploy-pages` 404s and reds the whole run even though
    # `build` — the real verification — passed. Skip deploying while the repo
    # is private; it resumes automatically if the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test deployed Pages
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20    # initial Pages propagation grace
          for path in "" "schema/main/" "schema/current/"; do
            full="${URL%/}/$path"
            for attempt in 1 2 3; do
              if curl -fsSL -o /dev/null "$full"; then
                echo "OK  $full"
                break
              fi
              [ "$attempt" -eq 3 ] && { echo "FAIL $full (3 attempts)"; exit 1; }
              sleep 10
            done
          done
          echo "All paths return 200."

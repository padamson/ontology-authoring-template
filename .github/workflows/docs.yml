name: Build and publish docs

on:
  push:
    branches: [main]
  # A pull request gets the same build and verification as a push, Pages
  # artifact included, but no deploy. This is what tests a Dependabot PR
  # before it is merged by hand; the repo itself is trunk-based, so a human
  # rarely opens one.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys from main queue behind each other and never cancel. A pull
# request gets a group of its own, and a new push to it cancels the stale
# run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt the JS-based actions (actions/cache, actions/checkout,
# actions/upload-artifact, ...) into Node 24 ahead of the June 2026
# default flip. Removes the deprecation warnings; safe to drop this
# env block once Node 24 becomes the runner default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Exact pins, not ranges. This book's premise is frozen listings, so a
  # rerun of an unchanged commit must render identically, and an unpinned
  # tool breaks that on a day nobody touched the repo. mdbook-listings
  # 0.2.1 is the proof that patch releases are not safe here: it changed
  # rendered output (backticks in a caption became code) within a patch
  # bump, so semver protects nothing for a tool that renders the published
  # artifact. Keep each value in step with the local binary the README
  # installs. tool-pins.yml opens an issue when crates.io moves past one
  # (scripts/check-tool-pins.sh). The two `--git` installs below
  # (panschema, mdbook-admonish) deliberately resolve branch tips — the dogfood-matrix convention, not
  # an oversight.
  MDBOOK_VERSION: "0.5.2"
  MDBOOK_LISTINGS_VERSION: "0.2.1"
  WASM_PACK_VERSION: "0.14.0"

jobs:
  # The pre-commit hook is per-clone and `--no-verify` skips it, so assert
  # the same rule on what actually landed. This repo is trunk-based with
  # direct pushes, so the aggregate to check is the push itself:
  # `github.event.before`..HEAD, or the PR's base for a pull request.
  # Skipped when that SHA is unusable — the first push to a branch reports
  # all-zeros, a force-push can name a commit this checkout does not have,
  # and a manual dispatch has none.
  skill-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skill version bumped since the previous tip
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable previous tip for this event; nothing to compare."
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Previous tip $BEFORE is not in this checkout (force-push?); skipping."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BEFORE"

  build:
    runs-on: ubuntu-latest
    outputs:
      unbootstrapped: ${{ steps.bootstrap.outputs.unbootstrapped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # panschema publish reads all version tags

      - name: Detect a copy of the template not yet bootstrapped
        id: bootstrap
        # "Use this template" copies the wine showcase without its release
        # tags, so `panschema publish` fails on the tags the showcase
        # manifest lists, and a new repo has no Pages site to deploy to. A
        # repo other than the template that still carries scaffold/ has not
        # run erect-scaffold yet: build and verify the showcase, but publish
        # and deploy nothing until the scaffold is erected. The template is
        # recognized by its GitHub template flag or by name, so a rename
        # alone cannot stop it publishing.
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          if [ -d scaffold ] && [ "$IS_TEMPLATE" != "true" ] \
             && [ "$GITHUB_REPOSITORY" != "padamson/ontology-authoring-template" ]; then
            echo "unbootstrapped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Copy of the template not yet bootstrapped; skipping publish and deploy until erect-scaffold has run."
          fi

      # --- Resolve producer main HEAD SHAs (dogfood-matrix conventions) ---

      - name: Resolve latest panschema main SHA
        id: panschema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/panschema/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve mdbook-admonish fork branch SHA
        id: mdbook-admonish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/padamson/mdbook-admonish/commits/feat/mdbook-0.5-compat --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      # --- panschema (needs wasm-pack as a build prerequisite) ---

      - name: Cache panschema binaries
        id: cache-panschema
        uses: actions/cache@v4
        with:
          # panschema (schema docs) and mdbook-panschema (book→schema
          # toolbar link installer) both ship from the one panschema
          # crate, so a single install produces both executables. The
          # `-bins-` key prefix (vs the old `panschema-`) deliberately
          # busts pre-mdbook-panschema cache entries that hold only the
          # one binary.
          path: |
            ~/.cargo/bin/panschema
            ~/.cargo/bin/mdbook-panschema
          key: panschema-bins-${{ runner.os }}-${{ steps.panschema.outputs.sha }}

      - name: Cache wasm-pack binary
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        if: steps.cache-panschema.outputs.cache-hit != 'true' && steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked

      - name: Install panschema binaries from main
        if: steps.cache-panschema.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/padamson/panschema \
            --rev ${{ steps.panschema.outputs.sha }} \
            --locked --force \
            panschema

      # --- mdbook + preprocessors ---

      - name: Cache mdbook binary
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ runner.os }}-${{ env.MDBOOK_VERSION }}

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version ${{ env.MDBOOK_VERSION }} --locked

      - name: Cache mdbook-listings binary
        id: cache-mdbook-listings
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-listings
          key: mdbook-listings-${{ runner.os }}-${{ env.MDBOOK_LISTINGS_VERSION }}

      - name: Install mdbook-listings from crates.io
        # Switched off git-main to the released crate (v0.1.1, 2026-08-01):
        # everything the prerelease dogfood exercised — appendix numbering,
        # captions, list-of-listings, the soft-wrap/font-load badge fixes —
        # is in the release, so there's no reason left to track git.
        if: steps.cache-mdbook-listings.outputs.cache-hit != 'true'
        run: cargo install mdbook-listings --version ${{ env.MDBOOK_LISTINGS_VERSION }} --locked

      - name: Cache mdbook-admonish binary
        id: cache-mdbook-admonish
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-admonish
          key: mdbook-admonish-${{ runner.os }}-${{ steps.mdbook-admonish.outputs.sha }}

      - name: Install mdbook-admonish from fork branch
        if: steps.cache-mdbook-admonish.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/padamson/mdbook-admonish \
            --rev ${{ steps.mdbook-admonish.outputs.sha }} \
            --locked --force \
            mdbook-admonish

      # --- The cqa contract (pinned dependency) ---

      - name: Check the lockfile (panschema)
        # data/wine-benchmark.yaml is instance data of the cqa contract.
        # panschema.toml pins cqa by `source` + `version`, and
        # panschema.lock records the checksum that pin resolved to. This
        # downloads the tagged release into the runner's cache and fails
        # if what it fetched drifts from the lockfile, so every later
        # step reads exactly the contract the lockfile names.
        run: panschema fetch --check

      # --- Build outputs ---

      - name: Verify everything the manifest declares (panschema)
        # Bare `verify` reads panschema.toml and checks it all without
        # writing outputs: each curated A-box conforms to its own schema
        # (the wine catalog to wine, the benchmark to cqa), and the
        # `[check.cqa]` cross-graph gates — every benchmark IRI resolves
        # to one wine's graph actually mints, every stated absence holds,
        # no reference lands in an uncovered namespace. This repo is the
        # one place the cross-graph half is possible, because it holds
        # both graphs. `publish` only warns on violations, so fail fast
        # here before building anything.
        run: panschema verify --strict

      - name: Assert invalid fixtures are rejected (panschema)
        # The negative half of verification: every data/invalid/*.yaml MUST
        # fail. If one conforms, the schema stopped catching that error and
        # ch07's "a mistyped verdict fails the check" claim is now false. The
        # top-level data/*.yaml loop above does not recurse, so these stay out
        # of the positive loop.
        run: |
          shopt -s nullglob
          schema="$(scripts/schema-path.sh)"
          for f in data/invalid/*.yaml; do
            if panschema verify --schema "$schema" --data "$f" >/dev/null 2>&1; then
              echo "FAIL: $f conformed but should have been rejected"; exit 1
            fi
            echo "ok, rejected: $f"
          done

      - name: Generate machine-readable artifacts (panschema)
        # TTL (schema + A-box KG), SHACL shapes, JSON Schema, and the
        # instance-graph JSON — the "Other formats" the book names but the
        # publish path never emits. Reads panschema.toml and lands in
        # site/artifacts/, deployed with the site. --strict fails on hard
        # errors (unmodeled constructs, dangling refs, instance-data
        # violations); it is narrower than its name — NOT the
        # unprojected-construct / Postgres-skip / SHACL-skip warnings.
        run: panschema generate --strict

      - name: Publish versioned schema docs (panschema)
        # Output layout: site/schema/main/ (edge), site/schema/current/
        # (alias for the configured `current` version), plus
        # site/schema/<tag>/ for each release tag in panschema-publish.toml.
        if: steps.bootstrap.outputs.unbootstrapped != 'true'
        run: panschema publish

      - name: Generate book assets (admonish + listings)
        # mdbook-admonish.css and mdbook-listings.css/.js are gitignored
        # generated assets, so a fresh CI checkout lacks them and `mdbook
        # build` fails copying mdbook-admonish.css. install-assets.sh
        # regenerates both from the binaries installed above — the same
        # script the README "Fresh clone" note and setup-ontology use
        # locally, so CI and local builds share one path.
        run: ./scripts/install-assets.sh

      - name: Verify frozen listings (mdbook-listings)
        # Fail fast on frozen-snapshot hash drift or a broken
        # {{#include}} / {{#callout}} before the longer book build.
        # Mirrors the local prek/pre-commit hook (.pre-commit-config.yaml).
        working-directory: book
        run: mdbook-listings verify --book-root .

      - name: Build the book (mdbook)
        # Outputs to book/build/ per the [build] build-dir config.
        # build-book.sh also fails on a logged ERROR (see its header).
        run: ./scripts/build-book.sh

      - name: Combine book + schema docs into site/
        # Book lands at site/ root (index.html, theme/, ch*.html);
        # site/schema/ already populated by `panschema publish`.
        # `cp -r book/build/* site/` is safe because mdbook never
        # produces a `schema/` subdir.
        if: steps.bootstrap.outputs.unbootstrapped != 'true'
        run: cp -r book/build/* site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.bootstrap.outputs.unbootstrapped != 'true'
        with:
          path: site/

  deploy:
    needs: build
    # GitHub Pages on a private repo requires a paid plan, so on a private
    # instantiation `deploy-pages` 404s and reds the whole run even though
    # `build` — the real verification — passed. Skip deploying while the repo
    # is private; it resumes automatically if the repo goes public. Skipped
    # too on a copy of the template not yet bootstrapped (see `build`), and
    # on a pull request, which only verifies.
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private && needs.build.outputs.unbootstrapped != 'true' }}
    runs-on: ubuntu-latest
    # The only job that writes to Pages, so the only one granted it.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test deployed Pages
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20    # initial Pages propagation grace
          for path in "" "schema/main/" "schema/current/"; do
            full="${URL%/}/$path"
            for attempt in 1 2 3; do
              if curl -fsSL -o /dev/null "$full"; then
                echo "OK  $full"
                break
              fi
              [ "$attempt" -eq 3 ] && { echo "FAIL $full (3 attempts)"; exit 1; }
              sleep 10
            done
          done
          echo "All paths return 200."

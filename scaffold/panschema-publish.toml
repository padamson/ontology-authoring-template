[schema]
name = "myschema"
version = "0.1.0"
linkml = "1.7.0"

[files]
main = "schema/myschema.yaml"

[publishing]
versions = []
edge = "main"
# Release reminder: when releasing the first version, flip `current`
# from "main" to the new tag (e.g., "main" -> "v0.1.0" in the v0.1.0
# release commit) so `/schema/current/` aliases to the new release.
# Also: append the new tag to `versions` above.
current = "main"
output_dir = "site/schema"
format = "html"
# Header brand/home link target. Our publish dir is site/schema/<version>/,
# so "../../" escapes back to the book root (works in both localhost dev
# and the github.io deploy). The panschema default "../current/" assumes a
# standalone schema-only deploy and is wrong for this book-nested layout.
site_root_url = "../../"

# Curated instance graphs published behind the schema page's in-page
# selector. `name` labels each tab; `data` is repo-relative. Add the
# worked example here at Step 7 (`exemplar = true` marks the tab the
# page opens on).
#
# Naming a dependency schema moves a dataset onto a second published
# page: the cqa contract rendered with this repo's benchmark as its
# instance graph, at site/schema/cqa/. The page exists only at refs
# where both the dependency and the data do.
[[instances]]
name = "benchmark"
data = "data/myschema-benchmark.yaml"
schema = "cqa"

# The benchmark records lead on that page; the contract's reference
# section follows them.
[publishing.pages.cqa]
layout = "instances-first"

# Book→schema toolbar links (the reverse of site_root_url above): with
# two published pages, the toolbar button becomes a menu listing each
# entry by its label. Assets are installed by `mdbook-panschema install
# book` (see scripts/install-assets.sh) and are gitignored like the
# other generated book assets.
[[book_link]]
schema_path = "schema/current/"
label = "Schema reference"

# The benchmark page gains a `current/` alias with the first release,
# since the benchmark is part of the package from Step 1. Until then this
# entry points at the bleeding edge; move it to schema/cqa/current/ when
# `current` above flips.
[[book_link]]
schema_path = "schema/cqa/main/"
label = "CQ&A benchmark"
